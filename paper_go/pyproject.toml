[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-go"
version = "0.1.0"
description = "Download a paper and its cited references, then summarize each paper's topic and strategy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fengxu1996" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
paper_go = "paper_go.cli:main"

[tool.setuptools.packages.find]
include = ["paper_go*"]

[project.urls]
Homepage = "https://github.com/fengxu1996/plugins_aha"
Repository = "https://github.com/fengxu1996/plugins_aha"
